<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GoTune YouTube Player Host</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #player {
      width: 100%;
      height: 100%;
      min-width: 200px;
      min-height: 200px;
      border: 0;
    }
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9aa0a6;
      font: 13px -apple-system, Roboto, Arial, sans-serif;
      background: #000000;
      z-index: 2;
    }
    #status.hidden { display: none; }
  </style>
  <script defer src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div id="status">Loading YouTube player…</div>
  <div id="player"></div>

  <script>
    (function () {
      'use strict';

      var bridge = (window.flutter_webview && window.flutter_webview.postMessage)
        ? function (payload) { window.flutter_webview.postMessage(typeof payload === 'string' ? payload : JSON.stringify(payload)); }
        : function (payload) {
            if (window.console) window.console.log('[GoTuneYT Bridge] ' + JSON.stringify(payload));
          };

      var player = null;
      var apiReady = false;
      var playerReady = false;
      var pendingVideoId = null;
      var pendingAutoplay = true;
      var lastTimeSecond = -1;
      var timeUpdateTimer = null;

      function emit(type, extra) {
        try {
          var payload = { type: type };
          if (extra) {
            for (var key in extra) {
              if (Object.prototype.hasOwnProperty.call(extra, key)) {
                payload[key] = extra[key];
              }
            }
          }
          if (player && typeof player.getVideoData === 'function') {
            try {
              var data = player.getVideoData();
              if (data && data.video_id) {
                payload.videoId = data.video_id;
              }
            } catch (_) {}
          }
          bridge(payload);
        } catch (e) {
          if (window.console) window.console.log('[GoTuneYT] emit failed: ' + e);
        }
      }

      function safeCurrentSeconds() {
        try {
          return player && typeof player.getCurrentTime === 'function' ? (player.getCurrentTime() || 0) : 0;
        } catch (_) {
          return 0;
        }
      }

      function safeDurationSeconds() {
        try {
          return player && typeof player.getDuration === 'function' ? (player.getDuration() || 0) : 0;
        } catch (_) {
          return 0;
        }
      }

      function safeVideoId() {
        try {
          var data = player && typeof player.getVideoData === 'function' ? player.getVideoData() : null;
          return data && data.video_id ? data.video_id : pendingVideoId;
        } catch (_) {
          return pendingVideoId;
        }
      }

      function tick() {
        return {
          position: safeCurrentSeconds(),
          duration: safeDurationSeconds(),
          videoId: safeVideoId()
        };
      }

      function startTimeUpdates() {
        if (timeUpdateTimer !== null) return;
        lastTimeSecond = -1;
        timeUpdateTimer = window.setInterval(function () {
          var current = safeCurrentSeconds();
          var whole = Math.floor(current);
          if (whole !== lastTimeSecond) {
            lastTimeSecond = whole;
            emit('timeUpdate', tick());
          }
        }, 1000);
      }

      function stopTimeUpdates() {
        if (timeUpdateTimer !== null) {
          window.clearInterval(timeUpdateTimer);
          timeUpdateTimer = null;
        }
      }

      function onPlayerReady(event) {
        playerReady = true;
        var status = document.getElementById('status');
        if (status) status.classList.add('hidden');

        try {
          if (event && event.target) {
            if (typeof event.target.unMute === 'function') event.target.unMute();
            if (typeof event.target.setVolume === 'function') event.target.setVolume(100);
          }
        } catch (_) {}

        emit('ready', tick());

        // Play pending video if queued before the player became ready
        if (pendingVideoId) {
          var vid = pendingVideoId;
          var auto = pendingAutoplay;
          pendingVideoId = null;
          window.loadVideo(vid, auto);
        }
      }

      function onPlayerStateChange(event) {
        var data = event.data;

        switch (data) {
          case YT.PlayerState.UNSTARTED:
            emit('unstarted', tick());
            break;
          case YT.PlayerState.CUED:
            emit('cued', tick());
            break;
          case YT.PlayerState.BUFFERING:
            emit('buffering', tick());
            break;
          case YT.PlayerState.PLAYING:
            startTimeUpdates();
            emit('playing', tick());
            break;
          case YT.PlayerState.PAUSED:
            stopTimeUpdates();
            emit('paused', tick());
            break;
          case YT.PlayerState.ENDED:
            stopTimeUpdates();
            emit('ended', tick());
            break;
          default:
            break;
        }
      }

      function onPlayerError(event) {
        var code = event && typeof event.data === 'number' ? event.data : -1;
        stopTimeUpdates();
        emit('error', {
          code: code,
          position: safeCurrentSeconds(),
          duration: safeDurationSeconds(),
          videoId: safeVideoId(),
          message: 'YouTube player error code: ' + code
        });
      }

      function onAutoplayBlocked() {
        emit('autoplayBlocked', tick());
      }

      function buildPlayer(initialVideoId, autoplay) {
        if (player) return;

        var originUrl = (window.location && window.location.origin && window.location.origin.indexOf('http') === 0)
          ? window.location.origin
          : 'https://www.youtube.com';

        var playerConfig = {
          height: '100%',
          width: '100%',
          playerVars: {
            autoplay: autoplay ? 1 : 0,
            controls: 1,
            enablejsapi: 1,
            fs: 0,
            origin: originUrl,
            rel: 0,
            playsinline: 1,
            iv_load_policy: 3
          },
          events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
            onError: onPlayerError,
            onAutoplayBlocked: onAutoplayBlocked
          }
        };

        if (initialVideoId) {
          playerConfig.videoId = initialVideoId;
        }

        player = new YT.Player('player', playerConfig);
      }

      window.onYouTubeIframeAPIReady = function () {
        apiReady = true;
        if (window.YT && YT.Player) {
          YT.Player.prototype.onAutoplayBlocked = onAutoplayBlocked;
        }

        buildPlayer(pendingVideoId, pendingAutoplay);
        emit('ready', tick());
      };

      // Commands called from Flutter
      window.isApiReady = function () { return apiReady; };

      window.createPlayer = function (videoId, autoplay) {
        if (!videoId) return false;
        pendingVideoId = videoId;
        pendingAutoplay = autoplay !== false;

        if (!apiReady) {
          return false;
        }

        if (!player) {
          buildPlayer(videoId, pendingAutoplay);
          return true;
        }

        return window.loadVideo(videoId, pendingAutoplay);
      };

      window.loadVideo = function (videoId, autoplay) {
        if (!videoId) return false;
        pendingVideoId = videoId;
        pendingAutoplay = autoplay !== false;

        if (!player || !playerReady || typeof player.loadVideoById !== 'function') {
          if (apiReady && !player) {
            buildPlayer(videoId, pendingAutoplay);
          }
          return false;
        }

        try {
          if (autoplay === false) {
            player.cueVideoById(videoId, 0);
          } else {
            player.loadVideoById(videoId, 0);
            if (typeof player.unMute === 'function') player.unMute();
            if (typeof player.playVideo === 'function') player.playVideo();
          }
          lastTimeSecond = -1;
          emit('cued', { videoId: videoId });
          return true;
        } catch (e) {
          emit('error', { code: -1, message: String(e) });
          return false;
        }
      };

      window.loadAndPlayVideo = function (videoId) {
        return window.loadVideo(videoId, true);
      };

      window.playVideo = function () {
        if (player && typeof player.playVideo === 'function') {
          if (typeof player.unMute === 'function') player.unMute();
          player.playVideo();
        }
      };

      window.pauseVideo = function () {
        if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
      };

      window.seekTo = function (seconds) {
        if (player && typeof player.seekTo === 'function') {
          player.seekTo(Number(seconds) || 0, true);
        }
      };

      window.stopVideo = function () {
        stopTimeUpdates();
        if (player && typeof player.stopVideo === 'function') player.stopVideo();
      };

      window.setVolume = function (volume) {
        if (player && typeof player.setVolume === 'function') {
          if (typeof player.unMute === 'function') player.unMute();
          player.setVolume(Number(volume) || 0);
        }
      };

      window.getCurrentTime = function () { return safeCurrentSeconds(); };
      window.getDuration = function () { return safeDurationSeconds(); };
      window.getCurrentVideoId = function () { return safeVideoId(); };

      // Ensure YouTube IFrame API is loaded
      if (window.YT && window.YT.Player) {
        window.onYouTubeIframeAPIReady();
      } else {
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        var firstScriptTag = document.getElementsByTagName('script')[0];
        if (firstScriptTag && firstScriptTag.parentNode) {
          firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        } else {
          document.head.appendChild(tag);
        }
      }
    })();
  </script>
</body>
</html>
