name: gotune
description: "GoTune - Lightweight YouTube-Focused Music Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Embedded YouTube IFrame player host (Android WebView).
  # Used only to host the official IFrame Player API; no stream extraction.
  webview_flutter: ^4.7.0

  # Network & Image Caching
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # State Management & Persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/youtube_player/
