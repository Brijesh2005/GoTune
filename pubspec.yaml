name: gotune
description: "GoTune - Lightweight YouTube-Focused Music Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio playback & Background Audio Service
  just_audio: ^0.9.40
  audio_service: ^0.18.17
  audio_session: ^0.1.21

  # Embedded YouTube IFrame player host (Android WebView).
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0

  # Network & Image Caching
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # State Management & Persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Utilities & Music Catalogs
  intl: ^0.19.0
  saavn_play: ^1.2.0
  dart_des: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/youtube_player/
